[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "excelr-track360-backend"
version = "0.1.0"
description = "ExcelR Track360 - Student Lifecycle & Operations Management Platform Backend"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "ExcelR Track360 Engineering Team", email = "dev@excelr.com" }
]
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.30.0,<0.35.0",
    "pydantic>=2.9.0,<2.14.0",
    "pydantic-settings>=2.5.0,<2.16.0",
    "sqlalchemy>=2.0.30,<2.1.0",
    "asyncpg>=0.29.0,<0.32.0",
    "alembic>=1.13.0,<1.21.0",
    "httpx>=0.27.0,<0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.2.0",
    "pytest-asyncio>=0.24.0,<1.5.0",
    "pytest-cov>=5.0.0,<7.2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
