# ExcelR Track360 - Local Development Infrastructure Stack
version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: track360-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-track360_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-track360_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-track360_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-track360_user} -d ${POSTGRES_DB:-track360_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - track360-network

volumes:
  postgres_data:
    name: track360_postgres_data

networks:
  track360-network:
    name: track360-network
