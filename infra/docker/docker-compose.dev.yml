# ExcelR Track360 - Development Environment Compose Definition
version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: track360-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-track360_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-track360_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-track360_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-track360_user} -d ${POSTGRES_DB:-track360_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - track360-dev-network

volumes:
  postgres_dev_data:
    name: track360_postgres_dev_data

networks:
  track360-dev-network:
    name: track360-dev-network
